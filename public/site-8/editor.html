<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <base href="/site-8/" />
  <title>Customize · Luxury Ivory Reception | Mehfill.in</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&family=Allura&family=Great+Vibes&family=Playfair+Display:ital@0;1&family=Marcellus&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="editor.css" />
</head>
<body>

  <header class="ed-top">
    <div class="ed-brand">
      <a class="ed-logo" href="https://mehfill.in/" target="_blank" rel="noopener">Mehfill.in</a>
      <span class="ed-dot" aria-hidden="true">·</span>
      <span class="ed-template">Luxury Ivory Reception</span>
    </div>
    <div class="ed-status" id="save-status" role="status" aria-live="polite">Saved locally</div>
    <div class="ed-tools" role="toolbar" aria-label="Editor tools">
      <div class="ed-seg" role="group" aria-label="Preview size">
        <button type="button" class="seg-btn is-on" data-device="desktop" aria-pressed="true" title="Desktop preview">Desktop</button>
        <button type="button" class="seg-btn" data-device="mobile" aria-pressed="false" title="Mobile preview">Mobile</button>
      </div>
      <button type="button" class="tool-btn" id="btn-undo" title="Undo" aria-label="Undo" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 14 4 9l5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="tool-btn" id="btn-redo" title="Redo" aria-label="Redo" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m15 14 5-5-5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H10a6 6 0 0 0 0 12h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="tool-btn" id="btn-export" title="Export JSON" aria-label="Export configuration">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 4v10m0 0 4-4m-4 4-4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 17v2a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="tool-btn" id="btn-import" title="Import JSON" aria-label="Import configuration">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 14V4m0 0 4 4m-4-4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 17v2a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="tool-btn" id="btn-reset" title="Reset to demo" aria-label="Reset to demo">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 4v4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="tool-btn tool-save" id="btn-save" title="Save draft">Save</button>
      <button type="button" class="tool-primary" id="btn-publish">Preview &amp; Share</button>
    </div>
  </header>

  <div class="ed-body">
    <aside class="ed-sidebar" id="sidebar" aria-label="Customisation panels">
      <div class="ed-panels" id="panels"><!-- built by editor.js --></div>
      <div class="ed-sidebar-foot">
        <p>Your draft is saved in this browser. Photos you upload stay on this device until you connect cloud publishing on Mehfill.in.</p>
        <a href="https://mehfill.in/templates" target="_blank" rel="noopener">Back to templates</a>
      </div>
    </aside>

    <main class="ed-main">
      <div class="ed-preview-label"><span>Live preview</span></div>
      <div class="ed-preview-wrap">
        <div class="ed-device mode-desktop" id="device">
          <iframe id="preview" src="index.html?embed=1" title="Live invitation preview" loading="eager"></iframe>
        </div>
      </div>
    </main>
  </div>

  <button type="button" class="ed-fab" id="sidebar-toggle" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Customise</span>
  </button>
  <div class="ed-scrim" id="sidebar-scrim" hidden></div>

  <div class="ed-modal" id="modal" hidden>
    <div class="ed-modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Title</h2>
      <div id="modal-body"></div>
      <div class="ed-modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <div class="ed-toast" id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="file-dialog" accept="image/jpeg,image/png,image/webp" hidden />

  <script src="js/invitation-data.js"></script>
  <script src="js/invitation-renderer.js"></script>
  <script src="editor.js"></script>
</body>
</html>
